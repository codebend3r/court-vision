name: 🩺 System check

# The format, lint, type, test, build and accessibility gate, shared by
# pull-request-checks (on every PR) and sanity-check (on every push to main) so
# the two never drift. Both jobs are matrices: every check is its own leg and
# the legs run side by side, so the gate takes as long as its slowest check
# instead of the sum of all of them. Each leg installs from the shared package
# cache (.github/actions/setup), which is what keeps the repeated install cheap.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  database:
    name: 🗄️ Database concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: court_vision_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/court_vision_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/court_vision_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Create isolated test schema
        working-directory: apps/court-vision
        run: bunx --bun prisma db push
      - name: Check concurrent mutations
        run: bun run --cwd apps/court-vision test:db

  static:
    name: ${{ matrix.emoji }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { emoji: 💅, label: Format (Oxfmt), script: "format:check" }
          - { emoji: 🔍, label: Lint (Oxlint), script: "lint:ts" }
          - { emoji: 📏, label: Parameter types, script: "lint:params" }
          - { emoji: 🎨, label: Lint SCSS (Gale), script: "lint:scss" }
          - { emoji: 🔤, label: Spelling (typos), script: "lint:spell" }
          # Lints the workflows in this very directory: bad `uses:` refs,
          # undefined `needs:`/`steps:` outputs, invalid `${{ }}` expressions,
          # and, via the shellcheck preinstalled on ubuntu-latest, the `run:`
          # scripts themselves. Nothing else here parses these files, so a
          # typo'd expression would otherwise only surface as a silently empty
          # string at runtime.
          - { emoji: ⚙️, label: Workflows (actionlint), script: "lint:actions" }
          - { emoji: 🏷️, label: TypeScript (tsgo), script: "typecheck" }
          - { emoji: 🧪, label: Tests, script: "test" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun and dependencies
        uses: ./.github/actions/setup

      - name: ${{ matrix.emoji }} ${{ matrix.label }}
        env:
          SCRIPT: ${{ matrix.script }}
        run: bun run "$SCRIPT"

  # One leg per app, so the four shells and the extension build while Court
  # Vision builds and runs its accessibility suite, instead of after it.
  build:
    name: 🏗️ Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: court-vision, a11y: true }
          - { project: rink-vision, a11y: false }
          - { project: diamond-vision, a11y: false }
          - { project: field-vision, a11y: false }
          - { project: court-vision-extension, a11y: false }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          next-cache: ${{ matrix.a11y }}

      # Typecheck does not see RSC boundary violations, bad route config, or a
      # server-only import pulled into a client component; those only surface
      # at build. Every data page is dynamic, so this needs no database.
      - name: 🏗️ Build
        env:
          PROJECT: ${{ matrix.project }}
        run: bunx nx run "$PROJECT:build" --output-style=static

      - name: 🌐 Install Chromium
        if: ${{ matrix.a11y }}
        timeout-minutes: 5
        working-directory: apps/court-vision
        run: bunx --no-install playwright install --with-deps chromium

      - name: ♿ Accessibility
        if: ${{ matrix.a11y }}
        run: bun run test:a11y
