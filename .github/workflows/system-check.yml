name: 🩺 System check

# The format, lint, type, test, build and accessibility gate, shared by
# pull-request-checks (on every PR) and sanity-check (on every push to main) so
# the two never drift. It is split into two jobs that run side by side, each
# shorter than the Lighthouse matrix in pull-request-checks, so neither one
# sets the pace of a PR run.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: 🔍 Lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # The root postinstall runs `prisma generate`, so the client is ready
      # once this step ends.
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 💅 Format (Oxfmt)
        run: bun run format:check

      - name: 🔍 Lint (Oxlint)
        run: bun run lint:ts

      - name: 🎨 Lint SCSS (Gale)
        run: bun run lint:scss

      - name: 🔤 Spelling (typos)
        run: bun run lint:spell

      # Lints the workflows in this very directory: bad `uses:` refs, undefined
      # `needs:`/`steps:` outputs, invalid `${{ }}` expressions, and — via the
      # shellcheck preinstalled on ubuntu-latest — the `run:` scripts themselves.
      # Nothing else here parses these files, so a typo'd expression would
      # otherwise only surface as a silently empty string at runtime.
      - name: ⚙️ Workflows (actionlint)
        run: bun run lint:actions

      - name: 🏷️ TypeScript (tsgo)
        run: bun run typecheck

      - name: 🧪 Test
        run: bun run test

  build:
    name: 🏗️ Build & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Chromium's apt dependencies are network-bound and the build is
      # CPU-bound, so the install runs in the background while the apps build.
      # A process a step leaves behind keeps running into later steps (the perf
      # job's server relies on the same thing); its exit code lands in a file
      # that the wait step below reads.
      - name: 🌐 Install Chromium (background)
        run: |
          {
            status=0
            bunx playwright install --with-deps chromium || status=$?
            echo "$status" > "$RUNNER_TEMP/chromium.status"
          } > "$RUNNER_TEMP/chromium.log" 2>&1 &

      # Typecheck does not see RSC boundary violations, bad route config, or a
      # server-only import pulled into a client component — those only surface
      # at build. Every data page is dynamic, so this needs no database.
      - name: 🏗️ Build
        run: bun run build

      - name: 🌐 Wait for Chromium
        timeout-minutes: 5
        run: |
          until [ -f "$RUNNER_TEMP/chromium.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/chromium.log"
          exit "$(cat "$RUNNER_TEMP/chromium.status")"

      - name: ♿ Accessibility
        run: bun run test:a11y
