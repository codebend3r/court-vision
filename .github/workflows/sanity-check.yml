name: ✅ Sanity check

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanity-check:
    name: 🩺 Sanity check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🚦 Full check
        run: bun run system-check

      - name: 🎉 All clear
        run: echo "✅ ${GITHUB_SHA:0:7} landed on \`main\` clean — format, lint, types, tests, and build all green." >> "$GITHUB_STEP_SUMMARY"

      - name: 🚨 Something broke
        if: failure()
        run: echo "💥 ${GITHUB_SHA:0:7} broke \`main\` — check the failed step above." >> "$GITHUB_STEP_SUMMARY"
