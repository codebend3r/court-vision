name: ✅ Sanity check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: 🩺 Checks
    uses: ./.github/workflows/system-check.yml

  summary:
    name: 🩺 Sanity check
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 🎉 All clear
        if: needs.checks.result == 'success'
        run: echo "✅ ${GITHUB_SHA:0:7} landed on \`main\` clean — format, lint, types, tests, and build all green." >> "$GITHUB_STEP_SUMMARY"

      - name: 🚨 Something broke
        if: needs.checks.result != 'success'
        run: |
          echo "💥 ${GITHUB_SHA:0:7} broke \`main\` — check the failed job above." >> "$GITHUB_STEP_SUMMARY"
          exit 1
