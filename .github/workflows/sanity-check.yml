name: ✅ Sanity check

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanity-check:
    name: 🩺 Sanity check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧬 Generate Prisma client
        run: bun run db:generate

      - name: 💅 Format (Oxfmt)
        run: bun run format:check

      - name: 🔍 Lint (Oxlint)
        run: bun run lint:ts

      - name: 🎨 Lint SCSS (Gale)
        run: bun run lint:scss

      - name: 🔤 Spelling (typos)
        run: bun run lint:spell

      # Lints the workflows in this very directory: bad `uses:` refs, undefined
      # `needs:`/`steps:` outputs, invalid `${{ }}` expressions, and — via the
      # shellcheck preinstalled on ubuntu-latest — the `run:` scripts themselves.
      # Nothing else here parses these files, so a typo'd expression would
      # otherwise only surface as a silently empty string at runtime.
      - name: ⚙️ Workflows (actionlint)
        run: bun run lint:actions

      - name: 🏷️ TypeScript (tsgo)
        run: bun run typecheck

      - name: 🧪 Test
        run: bun run test

      # Typecheck does not see RSC boundary violations, bad route config, or a
      # server-only import pulled into a client component — those only surface
      # at build. Every data page is dynamic, so this needs no database.
      - name: Build
        run: bun run build

      - name: 🌐 Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: ♿ Accessibility
        run: bun run test:a11y

      - name: 🎉 All clear
        run: echo "✅ ${GITHUB_SHA:0:7} landed on \`main\` clean — format, lint, types, tests, and build all green." >> "$GITHUB_STEP_SUMMARY"

      - name: 🚨 Something broke
        if: failure()
        run: echo "💥 ${GITHUB_SHA:0:7} broke \`main\` — check the failed step above." >> "$GITHUB_STEP_SUMMARY"
