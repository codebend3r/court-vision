name: 🧪 Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: 🩺 System check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧬 Generate Prisma client
        run: bun run db:generate

      - name: 💅 Format (Oxfmt)
        run: bun run format:check

      - name: 🔍 Lint (Oxlint)
        run: bun run lint:ts

      - name: 🎨 Lint SCSS (Gale)
        run: bun run lint:scss

      - name: 🔤 Spelling (typos)
        run: bun run lint:spell

      # Lints the workflows in this very directory: bad `uses:` refs, undefined
      # `needs:`/`steps:` outputs, invalid `${{ }}` expressions, and — via the
      # shellcheck preinstalled on ubuntu-latest — the `run:` scripts themselves.
      # Nothing else here parses these files, so a typo'd expression would
      # otherwise only surface as a silently empty string at runtime.
      - name: ⚙️ Workflows (actionlint)
        run: bun run lint:actions

      - name: 🏷️ TypeScript (tsgo)
        run: bun run typecheck

      - name: 🧪 Test
        run: bun run test

      # Typecheck does not see RSC boundary violations, bad route config, or a
      # server-only import pulled into a client component — those only surface
      # at build. Every data page is dynamic, so this needs no database.
      - name: Build
        run: bun run build

      - name: 🌐 Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: ♿ Accessibility
        run: bun run test:a11y

  perf:
    name: ⚡ Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧬 Generate Prisma client
        run: bun run db:generate

      - name: 🏗️ Build
        run: bun run build

      # Signed out, the audited routes touch neither Supabase nor the database,
      # so no env is needed: the same property the a11y job relies on.
      #
      # 46644 sits inside Linux's ephemeral port range (32768-60999), so a socket
      # the build left behind can briefly hold it and `next start` dies with
      # EADDRINUSE. A server that exits is retried after a pause instead of
      # being polled for a minute; one that is up but never answers still fails.
      - name: 🚀 Start server
        run: |
          for attempt in 1 2 3; do
            bun run start --port 46644 &
            server=$!
            for _ in $(seq 1 60); do
              curl -sf http://localhost:46644/login > /dev/null && exit 0
              kill -0 "$server" 2> /dev/null || break
              sleep 1
            done
            kill -0 "$server" 2> /dev/null && echo "Server never answered" && exit 1
            echo "Server exited (attempt $attempt); sockets on 46644:"
            ss -tanp "sport = :46644" || true
            sleep 5
          done
          echo "Server never came up" && exit 1

      # 🆓 Lighthouse CI: free, offline, no API keys. Chrome is preinstalled on
      # ubuntu-latest. Budgets live in apps/court-vision/lighthouserc.json;
      # assertions run on the median of 3 runs.
      #
      # Lighthouse is the ONLY perf gate here, deliberately. `bun run
      # perf:budget` skips its database-backed routes without a DATABASE_URL,
      # which would leave it measuring the exact three routes Lighthouse already
      # covers, with a weaker signal (raw fetch TTFB vs LCP/CLS/TBT). Running it
      # would read as coverage while asserting nothing new. The routes that need
      # it (/players) need a seeded database; the only seed path is `seed:demo`,
      # which needs a live Balldontlie key and free-tier throttling. Until an
      # offline fixture seed exists, perf:budget runs locally and pre-release.
      # See .claude/skills/perf-budget.
      - name: 🔦 Lighthouse budgets
        working-directory: apps/court-vision
        run: bunx @lhci/cli@0.15.1 autorun

      - name: 📤 Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: apps/court-vision/.lighthouseci/reports
          if-no-files-found: ignore

  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # 🛑 Blocking. Encodes the invariants the cv-security review agent checks:
      # the server/client secret boundary, unguarded server actions, and raw
      # Prisma interpolation. Runs offline, no API key needed. 🔌
      - name: 🛡️ Security scan
        run: bun run security:scan

      # ⚠️ Non-blocking on purpose. Every advisory today is transitive through dev
      # tooling (sass, prisma) with no runtime exposure, and `bun audit` has no
      # --prod flag to separate them. Reports to the job summary so regressions
      # are visible; flip to blocking once the dev-tool advisories clear. 📊
      - name: 🔬 Dependency audit
        continue-on-error: true
        run: |
          echo '## 🔬 Dependency audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bun audit --audit-level=high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: 🧠 CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: 🔎 Analyze
        uses: github/codeql-action/analyze@v3
