name: 🧪 Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  system:
    name: 🩺 Checks
    uses: ./.github/workflows/system-check.yml

  # Branch protection requires a check named "🩺 System check". Checks from a
  # reusable workflow are reported as "🩺 Checks / <job>", so this job carries
  # the required name and passes only when every system-check job did.
  checks:
    name: 🩺 System check
    needs: system
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Verdict
        env:
          RESULT: ${{ needs.system.result }}
        run: |
          echo "System check: $RESULT"
          [ "$RESULT" = "success" ]

  # One job per audited route, so the Lighthouse runs (three per route, about
  # 14s each) happen side by side instead of nine in a row. Keep this list in
  # step with `collect.url` in apps/court-vision/lighthouserc.json, which is
  # what a local `lhci autorun` audits.
  perf:
    name: ⚡ Performance (/${{ matrix.route }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        route: [login, signup, design]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Only Court Vision is served; the shell apps are built by system-check.
      - name: 🏗️ Build
        run: bun run --cwd apps/court-vision build

      # Signed out, the audited routes touch neither Supabase nor the database,
      # so no env is needed: the same property the a11y job relies on.
      #
      # 46644 sits inside Linux's ephemeral port range (32768-60999), so a socket
      # the build left behind can briefly hold it and `next start` dies with
      # EADDRINUSE. A server that exits is retried after a pause instead of
      # being polled for a minute; one that is up but never answers still fails.
      - name: 🚀 Start server
        run: |
          for attempt in 1 2 3; do
            bun run start --port 46644 &
            server=$!
            for _ in $(seq 1 60); do
              curl -sf http://localhost:46644/login > /dev/null && exit 0
              kill -0 "$server" 2> /dev/null || break
              sleep 1
            done
            kill -0 "$server" 2> /dev/null && echo "Server never answered" && exit 1
            echo "Server exited (attempt $attempt); sockets on 46644:"
            ss -tanp "sport = :46644" || true
            sleep 5
          done
          echo "Server never came up" && exit 1

      # 🆓 Lighthouse CI: free, offline, no API keys. Chrome is preinstalled on
      # ubuntu-latest. Budgets live in apps/court-vision/lighthouserc.json;
      # assertions run on the median of 3 runs.
      #
      # Lighthouse is the ONLY perf gate here, deliberately. `bun run
      # perf:budget` skips its database-backed routes without a DATABASE_URL,
      # which would leave it measuring the exact three routes Lighthouse already
      # covers, with a weaker signal (raw fetch TTFB vs LCP/CLS/TBT). Running it
      # would read as coverage while asserting nothing new. The routes that need
      # it (/players) need a seeded database; the only seed path is `seed:demo`,
      # which needs a live Balldontlie key. Until an offline fixture seed
      # exists, perf:budget runs locally and pre-release.
      # See .claude/skills/perf-budget.
      - name: 🔦 Lighthouse budgets
        working-directory: apps/court-vision
        env:
          ROUTE: ${{ matrix.route }}
        run: bunx @lhci/cli@0.15.1 autorun --collect.url="http://localhost:46644/$ROUTE"

      - name: 📤 Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ matrix.route }}
          path: apps/court-vision/.lighthouseci/reports
          if-no-files-found: ignore

  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # 🛑 Blocking. Encodes the invariants the cv-security review agent checks:
      # the server/client secret boundary, unguarded server actions, and raw
      # Prisma interpolation. Runs offline, no API key needed. 🔌
      - name: 🛡️ Security scan
        run: bun run security:scan

      # ⚠️ Non-blocking on purpose. Every advisory today is transitive through dev
      # tooling (sass, prisma) with no runtime exposure, and `bun audit` has no
      # --prod flag to separate them. Reports to the job summary so regressions
      # are visible; flip to blocking once the dev-tool advisories clear. 📊
      - name: 🔬 Dependency audit
        continue-on-error: true
        run: |
          echo '## 🔬 Dependency audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bun audit --audit-level=high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: 🧠 CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: 🔎 Analyze
        uses: github/codeql-action/analyze@v3
