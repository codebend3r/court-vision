name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Format (Oxfmt)
        run: bun run format:check

      - name: Lint (Oxlint)
        run: bun run lint

      - name: Lint SCSS (Gale)
        run: bun run lint:scss

      - name: TypeScript (tsgo)
        run: bun run typecheck

      - name: Test
        run: bun run test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Blocking. Encodes the invariants the cv-security review agent checks:
      # the server/client secret boundary, unguarded server actions, and raw
      # Prisma interpolation. Runs offline, no API key needed.
      - name: Security scan
        run: bun run security:scan

      # Non-blocking on purpose. Every advisory today is transitive through dev
      # tooling (sass, prisma) with no runtime exposure, and `bun audit` has no
      # --prod flag to separate them. Reports to the job summary so regressions
      # are visible; flip to blocking once the dev-tool advisories clear.
      - name: Dependency audit
        continue-on-error: true
        run: |
          echo '## Dependency audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bun audit --audit-level=high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
