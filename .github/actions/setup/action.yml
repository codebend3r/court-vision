name: 🥟 Set up Bun and dependencies
description: Installs Bun, restores the Bun and (optionally) Next.js build caches, and installs the workspace.

inputs:
  next-cache:
    description: Restore and save apps/court-vision/.next/cache, so a build only recompiles what changed.
    default: "false"

runs:
  using: composite
  steps:
    - name: 🥟 Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    # Every job installs the same lockfile, so the package cache is shared by
    # all of them. A hit turns the install into a copy from disk.
    - name: 🗄️ Cache Bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # Keyed on the sources too, so a PR always saves a fresh entry; the
    # restore key falls back to the newest one for the same lockfile, which is
    # what makes the build incremental.
    - name: 🧱 Cache Next.js build
      if: ${{ inputs.next-cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apps/court-vision/.next/cache
        key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/court-vision/src/**', 'libs/*/src/**') }}
        restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

    # The root postinstall runs `prisma generate`, so the client is ready once
    # this step ends.
    - name: 📦 Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
