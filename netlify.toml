# The court-vizion Netlify site (court-vizion.netlify.app; court-vision was
# taken) deploys Court Vision from the repo root (its base directory), so this
# file lives here rather than in apps/court-vision. These two settings override
# the Netlify UI: build only Court Vision, not every app in the workspace, and
# publish its .next directory. The Next runtime reads `relativeAppDir` from
# that directory's required-server-files.json to find the app inside the
# monorepo, so the site needs no package directory.
#
# The rink-vision and diamond-vision sites do set one (apps/rink-vision,
# apps/diamond-vision), so Netlify reads that app's own netlify.toml first and
# never this file.
[build]
command = "bun run --cwd apps/court-vision build"
publish = "apps/court-vision/.next"

# Production applies pending Prisma migrations before it builds, so code that
# reads a new column never goes live ahead of the column. On 2026-10-27 the
# deploy of #88 shipped `League.syncStartedAt` without its migration and every
# signed-in page 500'd until `db:deploy` was run by hand. A failed migration
# fails the build, which leaves the previous deploy serving. Only production
# migrates: deploy previews and branch deploys share the production database,
# and an unmerged PR's migration must never reach it. `migrate deploy` uses
# DIRECT_URL (prisma.config.ts), which Netlify exposes to builds.
[context.production]
command = "bun run --cwd apps/court-vision db:deploy && bun run --cwd apps/court-vision build"

# Netlify Image CDN: allow transforming the remote images requested by the
# next/image loader in apps/court-vision/src/lib/images/netlifyLoader.ts: NBA
# headshots, and the Yahoo Fantasy league and team logos imported leagues
# hotlink (Yahoo's own defaults on s.yimg.com, uploads on its Cloudinary).
[images]
remote_images = [
  "https://cdn\\.nba\\.com/.*",
  "https://s\\.yimg\\.com/.*",
  "https://yahoofantasysports-res\\.cloudinary\\.com/.*",
]

# The Supabase publishable key and project URL are public by design — both
# ship in the client bundle (Next.js inlines NEXT_PUBLIC_* vars) and access is
# guarded by row-level security, not secrecy. Exempt them from Netlify's
# secrets scanner, which otherwise blocks the build on detecting their inlined
# values (in the bundle and in the auth design docs that reference the URL).
[build.environment]
SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL"

# Turbopack's persistent cache captures the build environment, so any secret
# exposed to the build — `BALLDONTLIE_API_KEY`, `DATABASE_URL` — ends up inside
# `.next/cache/turbopack/*.sst`. The Next runtime mirrors that directory to
# `.netlify/.next/cache` purely so `cache.save()`/`cache.restore()` can carry it
# between builds; it is never served, and never enters the static output or the
# server function bundle. The scanner walks it anyway and fails the build.
#
# Paths, not keys: omitting the KEY would blind the scanner to a genuine leak of
# that same secret into a client bundle. This omits only the build cache, so
# every byte that actually ships is still scanned. Verified against a production
# build — the key appears in 0 files under `.next` once `cache/` is excluded.
#
# Every spelling is listed because the value is matched against repo-root
# relative paths, and the cache is written to the app's .next and mirrored into
# a .netlify directory: the root one today, or apps/court-vision/.netlify if
# the site ever sets a package directory.
SECRETS_SCAN_OMIT_PATHS = "apps/court-vision/.next/cache/,.netlify/.next/cache/,apps/court-vision/.netlify/.next/cache/"
