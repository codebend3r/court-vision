# The diamond-vision Netlify site (diamond-vision.netlify.app) builds from the
# repo root as its base directory, with apps/diamond-vision as its package
# directory. Netlify reads the package directory's netlify.toml before the root
# one, which builds Court Vision. Every path here is relative to the base
# directory.
[build]
command = "bun run --cwd apps/diamond-vision build"
publish = "apps/diamond-vision/.next"
# Build only when this app, a lib it compiles, or the workspace's install and
# compiler setup changed; exit 0 skips the build. When both refs match (a first
# build or a retried deploy) the test fails and the build runs.
ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/diamond-vision libs/vision-core libs/vision-ui libs/sport-baseball package.json bun.lock bunfig.toml tsconfig.base.json"
